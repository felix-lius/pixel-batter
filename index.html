<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素击球手 · 单机版</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#0b0e14;
    font-family:"Courier New",Consolas,monospace;
    color:#e6edf3;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    overflow:hidden;
  }
  #wrap{position:relative;width:min(96vw,96vh);height:min(96vw,96vh);max-width:720px;max-height:720px;}
  canvas{
    width:100%;height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#0b0e14;
    border:2px solid #2b3344;
    display:block;border-radius:6px;
    box-shadow:0 0 40px #000a;
    touch-action:none;
  }
  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(11,14,20,0.93);text-align:center;gap:16px;padding:24px;
  }
  .hidden{display:none !important;}
  h1{font-size:42px;letter-spacing:6px;color:#ffd166;text-shadow:0 0 18px #ffd16655;font-weight:900;}
  .sub{color:#8b949e;font-size:14px;letter-spacing:1px;}
  .btn{
    padding:12px 30px;font-family:inherit;font-size:18px;font-weight:900;
    background:#ffd166;color:#0b0e14;border:none;border-radius:5px;cursor:pointer;
    letter-spacing:3px;transition:transform .08s,background .15s;
  }
  .btn:hover{background:#ffe08a;transform:translateY(-2px);}
  .btn.sec{background:#2b3344;color:#e6edf3;}
  .btn.sec:hover{background:#3a4456;}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .stat{color:#9aa4b2;font-size:14px;}
  .roles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:680px;}
  .role{
    width:150px;padding:14px 12px;border:2px solid #2b3344;border-radius:8px;
    cursor:pointer;background:#141a24;transition:border-color .15s,box-shadow .15s;
  }
  .role.sel{border-color:#ffd166;box-shadow:0 0 16px #ffd16655;}
  .role.locked{opacity:.45;cursor:not-allowed;}
  .role .rn{color:#ffd166;font-size:16px;font-weight:900;margin-bottom:8px;}
  .role .rd{color:#9aa4b2;font-size:11px;line-height:1.5;}
  .role .rc{margin-top:10px;font-size:13px;font-weight:700;}
  .cost{color:#ffd700;}
  #hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;
    color:#e6edf3;font-size:14px;pointer-events:none;text-shadow:0 1px 2px #000;}
  .bar{width:130px;height:12px;background:#2b3344;border-radius:6px;overflow:hidden;margin-top:4px;border:1px solid #3a4456;}
  .bar>i{display:block;height:100%;background:#4dd2ff;transition:width .1s linear;}
  .hearts{color:#ff5d5d;font-size:20px;letter-spacing:3px;margin-top:2px;}
  .tip{color:#8b949e;font-size:12px;max-width:600px;line-height:1.7;}
  .small{font-size:12px;color:#6b7280;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;max-width:620px;margin-top:4px;}
  .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:#aeb8c4;}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 6px rgba(255,255,255,.15);}
  /* 首页历史前三 */
  .lb{width:100%;max-width:420px;margin:2px auto 0;font-size:13px;color:#9aa4b2;}
  .lbTitle{color:#ffd166;font-weight:900;font-size:14px;letter-spacing:1px;margin-bottom:6px;}
  .lbEmpty{color:#6b7280;font-size:12px;}
  .lbRow{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:5px 12px;border:1px solid #2b3344;border-radius:6px;margin-bottom:5px;background:#141a24;}
  .lbRank{color:#ffd166;font-weight:900;font-size:15px;}
  .lbRow b{color:#e6edf3;font-weight:700;}
  /* 通用图标/文字按钮（开始页静音键、游戏页返回键共用基调） */
  .iconBtn{pointer-events:auto;background:#1b2230;border:1px solid #2b3344;color:#e6edf3;
    font-family:inherit;cursor:pointer;line-height:1;box-shadow:0 2px 8px #0006;}
  .iconBtn:active{transform:scale(.93);}
  /* 游戏页：返回键（位于体力读数下方，纯文字，无箭头） */
  #backBtn{display:inline-block;margin-top:8px;padding:8px 16px;border-radius:10px;
    font-size:13px;font-weight:700;}
  /* 开始页：静音键（绝对定位在右上角，避免与菜单内容重叠） */
  #menuMute{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:10px;
    font-size:20px;z-index:5;}
  /* 竖屏手机：可操控区域铺满整页，画布按短边撑满、居中 */
  @media (max-width:560px) and (orientation:portrait){
    h1{font-size:30px;letter-spacing:3px;}
    .tip{font-size:11px;line-height:1.6;}
    .roles{gap:8px;}
    .role{width:44%;padding:10px 8px;}
    .role .rn{font-size:14px;margin-bottom:6px;}
    .role .rd{font-size:10px;}
    .btn{font-size:16px;padding:10px 24px;}
    .bar{width:90px;}
    #hud{font-size:12px;}
    .hearts{font-size:16px;}
    .stat{font-size:12px;}
    #wrap{width:100vw;height:100vh;max-width:none;max-height:none;
      display:flex;align-items:center;justify-content:center;background:#0b0e14;}
    canvas{width:100vmin;height:100vmin;border:none;border-radius:0;box-shadow:none;}
    #menuMute{width:40px;height:40px;font-size:18px;}
    /* 竖屏提示：请横屏 */
    #rotateHint{display:flex;}
  }
  /* 横屏手机：画布以高度为基准的方形、水平居中；左右两侧即方向/回击操控区，整体幕布铺满横向空间 */
  @media (max-width:560px) and (orientation:landscape){
    html,body{touch-action:none;}
    h1{font-size:24px;letter-spacing:2px;}
    .sub{font-size:11px;}
    .tip{font-size:10px;line-height:1.5;max-width:92vw;}
    .roles{gap:8px;}
    .role{width:28%;padding:8px 6px;}
    .role .rn{font-size:12px;margin-bottom:5px;}
    .role .rd{font-size:9px;}
    .btn{font-size:14px;padding:8px 20px;letter-spacing:2px;}
    .bar{width:120px;}
    #hud{font-size:11px;top:6px;left:8px;right:8px;}
    .hearts{font-size:14px;}
    .stat{font-size:11px;}
    #menuMute{width:38px;height:38px;font-size:18px;top:10px;right:10px;}
    #wrap{width:100vw;height:100vh;max-width:none;max-height:none;
      display:flex;align-items:center;justify-content:center;background:#0b0e14;}
    canvas{width:100vh;height:100vh;max-width:100vw;max-height:100vw;border:none;border-radius:0;box-shadow:none;}
  }
  /* 竖屏横屏提示层 */
  #rotateHint{display:none;position:absolute;inset:0;z-index:30;background:#0b0e14;
    color:#ffd166;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-size:22px;letter-spacing:2px;text-align:center;padding:24px;}
  #rotateHint .small{font-size:12px;color:#8b949e;letter-spacing:0;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="360"></canvas>

  <!-- 开始菜单 -->
  <div id="menu" class="overlay">
    <button id="menuMute" class="iconBtn" title="音效开关">🔊</button>
    <h1>像素击球手</h1>
    <div class="sub">PIXEL BATTER · 单机版</div>
    <div class="stat">最高分 <span id="best" style="color:#ffd166">0</span> ｜ 金币 <span id="coins" style="color:#ffd700">0</span></div>
    <div id="top3" class="lb"></div>
    <div class="roles" id="roles"></div>
    <div class="row"><button class="btn" id="startBtn">开始游戏</button></div>
    <div class="tip">移动鼠标操控击球手在圆环内躲避弹幕，<b style="color:#ffd166">点击左键</b>把来袭子弹反弹（<b style="color:#4dd2ff">青色</b>）出去击杀敌人。<br>
      把角色、球、敌人摆成近似一条线（夹角≤30°）时，球会<b>自动锁定敌人</b>并命中；否则沿原方向飞出、可能落空——靠站位取胜。</div>
    <div class="legend">
      <div class="lg"><i class="dot" style="background:#66ffcc"></i>盾 · 护盾结界，8 秒内自动反弹来袭弹</div>
      <div class="lg"><i class="dot" style="background:#9d8cff"></i>慢 · 弹幕减速</div>
      <div class="lg"><i class="dot" style="background:#6bff8c"></i>力 · 体力回满</div>
      <div class="lg"><i class="dot" style="background:#ff5d5d"></i>命 · 加 1 条命</div>
    </div>
  </div>

  <!-- 结算 -->
  <div id="over" class="overlay hidden">
    <h1 id="overTitle">游戏结束</h1>
    <div class="stat">本局得分 <span id="finalScore" style="color:#ffd166">0</span></div>
    <div class="stat">获得金币 <span id="finalCoins" style="color:#ffd700">0</span> ｜ 最高分 <span id="overBest">0</span></div>
    <div class="stat">坚持 <span id="finalTime" style="color:#4dd2ff">0:00</span> ｜ 击杀 <span id="finalKills" style="color:#ff5d5d">0</span></div>
    <div id="newBest" class="hidden" style="color:#ffd700;font-size:16px;">★ 新纪录！</div>
    <div class="row">
      <button class="btn" id="retryBtn">再来一局</button>
      <button class="btn sec" id="menuBtn">返回菜单</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div>
      <div>分数 <span id="score" style="color:#ffd166">0</span></div>
      <div>金币 <span id="coin" style="color:#ffd700">0</span></div>
      <div class="hearts" id="hearts">♥♥♥</div>
    </div>
    <div style="text-align:right">
      <div>体力</div>
      <div class="bar"><i id="stamina" style="width:100%"></i></div>
      <div class="stat" id="lvlTxt">第 1 波</div>
      <button id="backBtn" class="iconBtn" title="返回菜单">返回</button>
    </div>
  </div>

  <div id="rotateHint">🔄<div>请横屏游玩</div><div class="small">将手机横置以获得更好体验</div></div>
</div>

<script>
(function(){
  "use strict";
  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;
  const CX = W/2, CY = H/2;
  const R = 162;            // 竞技场半径
  const STAMINA_COST = 14;  // 每次击球消耗
  const SLOW_FACTOR = 0.45; // 减速道具系数
  const JOY_MAX = 42;       // 摇杆最大偏移（逻辑像素）
  const MOVE_SPEED = 230;   // 满杆移动速度（逻辑像素/秒）

  ctx.imageSmoothingEnabled = false;

  // ---------- 角色定义 ----------
  const ROLES = {
    starter:{key:'starter', name:'初心者', cost:0,   hitR:30, bounce:1,  wall:false, explode:false, desc:'均衡型，新手友好'},
    baller :{key:'baller',  name:'其他模式', cost:120, hitR:30, bounce:1, wall:true,  explode:false, desc:'更多玩法，敬请期待'}
  };
  const ROLE_KEYS = ['starter','baller'];
  const UNDER_DEV = new Set(['baller']); // 尚未开发的角色

  // ---------- 存档 ----------
  function load(k,def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }
  function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  let coins   = load('pb_coins', 0);
  let best    = load('pb_best', 0);
  let unlocked= load('pb_roles', ['starter']);
  let top3    = load('pb_top3', []);   // 历史前三：{score, time, kills}

  // ---------- 音效（Web Audio 程序化合成，无外部资源）----------
  let SoundOn = load('pb_sound', true);
  let actx = null;
  function audioInit(){
    if(actx) { if(actx.state==='suspended') actx.resume(); return; }
    try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ actx=null; }
    if(actx && actx.state==='suspended') actx.resume();
  }
  // 单音（可滑音）
  function tone(freq, dur, type, vol, slideTo){
    if(!SoundOn || !actx) return;
    const t0=actx.currentTime;
    const o=actx.createOscillator();
    const g=actx.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.15, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }
  // 噪声爆点（用于击杀/爆炸）
  function noise(dur, vol){
    if(!SoundOn || !actx) return;
    const t0=actx.currentTime;
    const n=Math.max(1, Math.floor(actx.sampleRate*dur));
    const buf=actx.createBuffer(1,n,actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=actx.createBufferSource(); src.buffer=buf;
    const g=actx.createGain(); g.gain.value=vol||0.12;
    src.connect(g).connect(actx.destination); src.start(t0);
  }
  const SFX = {
    reflect(){ tone(520,0.07,'square',0.14); tone(820,0.05,'square',0.08); },
    lock(){    tone(960,0.05,'square',0.10); },
    kill(){    tone(200,0.13,'sawtooth',0.16,70); noise(0.07,0.10); },
    hurt(){    tone(150,0.22,'sawtooth',0.20,55); },
    pickup(){  tone(660,0.06,'triangle',0.13); tone(990,0.06,'triangle',0.11); },
    start(){   tone(440,0.08,'square',0.13); setTimeout(()=>tone(660,0.08,'square',0.13),80); setTimeout(()=>tone(880,0.12,'square',0.13),170); },
    over(){    tone(330,0.18,'sawtooth',0.17,120); setTimeout(()=>tone(220,0.30,'sawtooth',0.15,80),120); }
  };
  // 定时播放（在指定时刻触发，供 BGM 调度器使用）
  function toneAt(freq, dur, type, vol, t0){
    if(!actx) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }
  function noiseAt(dur, vol, t0){
    if(!actx) return;
    const n=Math.max(1, Math.floor(actx.sampleRate*dur));
    const buf=actx.createBuffer(1,n,actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=actx.createBufferSource(); src.buffer=buf;
    const g=actx.createGain(); g.gain.value=vol;
    src.connect(g).connect(actx.destination); src.start(t0);
  }
  // 循环背景音乐（Web Audio 程序化合成，8-bit 街机风；无外部资源）
  const BGM = {
    playing:false, id:null, step:0, next:0,
    // 16 步循环：A 小调 bassline + lead 旋律
    bass:[110.00,0,110.00,0, 146.83,0,146.83,0, 164.81,0,164.81,0, 130.81,0,130.81,0],
    lead:[0,0,220.00,0, 0,261.63,0,329.63, 0,0,220.00,0, 261.63,0,196.00,0],
    stepDur:0.135,
    start(){
      if(!actx || !SoundOn || this.playing) return;
      this.playing=true; this.step=0; this.next=actx.currentTime+0.08;
      this.id=setInterval(()=>this._sched(), 25);
    },
    _sched(){
      if(!actx) return;
      while(this.next < actx.currentTime + 0.12){
        const s=this.step % 16;
        const bf=this.bass[s], lf=this.lead[s];
        if(bf) toneAt(bf, this.stepDur*0.95, 'triangle', 0.09, this.next); // 低音
        if(lf) toneAt(lf, this.stepDur*0.85, 'square',   0.05, this.next); // 主旋律
        if(s%2===1) noiseAt(0.03, 0.022, this.next);                       // hi-hat 律动
        this.step++; this.next += this.stepDur;
      }
    },
    stop(){
      this.playing=false;
      if(this.id){ clearInterval(this.id); this.id=null; }
    }
  };

  // ---------- 状态 ----------
  let state = 'menu';      // menu | play | over
  let selectedRole = 'starter';
  let player, bullets, enemies, particles, items;
  let score, lives, stamina, level, time, spawnTimer, itemTimer, buffs;
  let mouse = {x:CX, y:CY};
  let last = 0;

  function newGame(){
    player   = {x:CX, y:CY, r:4, hitR:ROLES[selectedRole].hitR, invuln:0};
    bullets  = [];
    enemies  = [];
    particles= [];
    items    = [];
    score    = 0;
    lives    = 5;
    stamina  = 100;
    level    = 1;
    time     = 0;
    spawnTimer = 0;
    itemTimer  = 6;
    buffs    = {slow:0, shield:0};
    runKills = 0;
  }

  // ---------- 输入 ----------
  function toLogic(e){
    const rect = cvs.getBoundingClientRect();
    return { x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height) };
  }
  cvs.addEventListener('mousemove', e=>{ if(touchDevice) return; const p=toLogic(e); mouse.x=p.x; mouse.y=p.y; });
  cvs.addEventListener('mousedown', e=>{ if(state==='play') hitBall(); });
  // 触屏：横屏双区操控 —— 左半屏=方向摇杆（拖动移动），右半屏=回击（点击/按住挥击）
  let touchDevice=false, joyActive=false, joyOrigin=null, joyCur=null, rightHeld=false, swingCd=0;
  function touchSide(t){ return (t.clientX < window.innerWidth/2) ? 'L' : 'R'; }
  document.addEventListener('touchstart', e=>{
    if(e.target && e.target.id==='backBtn') return;   // 让「返回」按钮正常点击
    if(state!=='play') return;                         // 菜单/结算不拦截，保证按钮可用
    e.preventDefault();
    touchDevice=true;
    for(const t of e.changedTouches){
      if(touchSide(t)==='L' && !joyActive){
        const p=toLogic(t);
        joyActive=true; joyOrigin={x:p.x,y:p.y}; joyCur={x:p.x,y:p.y};
      }else if(touchSide(t)==='R' && !rightHeld){
        rightHeld=true; swingCd=0; hitBall();
      }
    }
  }, {passive:false});
  document.addEventListener('touchmove', e=>{
    if(state!=='play') return;
    e.preventDefault();
    if(!joyActive) return;
    for(const t of e.changedTouches){
      if(touchSide(t)==='L'){ const p=toLogic(t); joyCur={x:p.x,y:p.y}; }
    }
  }, {passive:false});
  function touchEnd(e){
    if(state!=='play') return;
    e.preventDefault();
    for(const t of e.changedTouches){
      if(touchSide(t)==='L'){ joyActive=false; joyOrigin=joyCur=null; }
      else { rightHeld=false; }
    }
  }
  document.addEventListener('touchend', touchEnd, {passive:false});
  document.addEventListener('touchcancel', touchEnd, {passive:false});

  // ---------- 工具 ----------
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  function spawnParticles(x,y,color,n,spd){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=spd*(0.4+Math.random());
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color});
    }
  }

  // ---------- 敌人 ----------
  function spawnEnemy(){
    const ang=Math.random()*Math.PI*2;
    let type='normal';
    if(level>=2 && Math.random()<0.30) type='spread';
    if(level>=3 && Math.random()<0.25) type='chaser';
    const e={ ang, orbitR:R, angSpeed:(0.25+Math.random()*0.5)*(Math.random()<0.5?1:-1),
              type, fireTimer:1.2+Math.random()*1.8, alive:true };
    enemies.push(e);
  }
  function enemyPos(e){ return { x:CX+Math.cos(e.ang)*e.orbitR, y:CY+Math.sin(e.ang)*e.orbitR }; }
  function angleDiff(a,b){ let d=Math.abs(a-b)%(Math.PI*2); if(d>Math.PI) d=Math.PI*2-d; return d; }
  function fireEnemy(e){
    const p=enemyPos(e);
    const baseAng=Math.atan2(player.y-p.y, player.x-p.x) + (Math.random()-0.5)*0.24;
    const spd=1.5+level*0.09;
    if(e.type==='normal'){
      bullets.push({x:p.x,y:p.y,vx:Math.cos(baseAng)*spd,vy:Math.sin(baseAng)*spd,r:3,friendly:false});
    }else if(e.type==='spread'){
      for(let k=-1;k<=1;k++){
        const a=baseAng+k*0.28;
        bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:3,friendly:false});
      }
    }else{ // chaser
      bullets.push({x:p.x,y:p.y,vx:Math.cos(baseAng)*spd,vy:Math.sin(baseAng)*spd,r:3,friendly:false,home:true});
    }
  }

  // ---------- 反击 ----------
  const AIM_CONE = Math.PI/6; // 30°：角色→球 与 角色→敌人 夹角在此范围内才自动锁敌
  // 反弹单颗来袭弹（含 30° 自动锁敌逻辑），返回是否锁敌命中
  function reflectBullet(b, role, fspd){
    const ab=Math.atan2(b.y-player.y, b.x-player.x);
    let target=null, bestDiff=AIM_CONE+1e-6;
    for(const e of enemies){
      if(!e.alive) continue;
      const ep=enemyPos(e);
      const ae=Math.atan2(ep.y-player.y, ep.x-player.x);
      const diff=angleDiff(ab, ae);
      if(diff<bestDiff){ bestDiff=diff; target=e; }
    }
    b.friendly=true;
    b.bounceLeft=(role.wall?1:0);
    b.explode=role.explode;
    if(target){
      // 三者近似共线（偏斜≤30°）：自动锁敌，瞄准敌人并持续追踪，命中可靠
      const tp=enemyPos(target);
      const ang=Math.atan2(tp.y-b.y, tp.x-b.x);
      b.vx=Math.cos(ang)*fspd; b.vy=Math.sin(ang)*fspd;
      b.lockTarget=target; b.locked=true;
      return true;
    }
    // 不在瞄准锥内：沿角色→球径向击出，不锁敌，靠站位，可能落空（非必中）
    b.vx=Math.cos(ab)*fspd; b.vy=Math.sin(ab)*fspd;
    b.lockTarget=null; b.locked=false;
    return false;
  }
  function hitBall(){
    if(stamina < STAMINA_COST) return;
    const role=ROLES[selectedRole];
    const fspd=7.5;
    let cnt=0, anyLock=false;
    for(const b of bullets){
      if(b.friendly) continue;
      const d=Math.hypot(b.x-player.x, b.y-player.y);
      if(d <= player.hitR + b.r){
        if(reflectBullet(b, role, fspd)) anyLock=true;
        cnt++;
        if(cnt>=role.bounce) break;
      }
    }
    if(cnt>0){
      stamina=Math.max(0, stamina-STAMINA_COST);
      spawnParticles(player.x,player.y,'#ffd166',10,3);
      SFX.reflect();
      if(anyLock) SFX.lock();
    }
  }

  // ---------- 道具 ----------
  const ITEMS=[
    {key:'shield',color:'#66ffcc',label:'盾'},
    {key:'slow',  color:'#9d8cff',label:'慢'},
    {key:'energy',color:'#6bff8c',label:'力'},
    {key:'heal',  color:'#ff5d5d',label:'命'}
  ];
  function spawnItem(){
    const a=Math.random()*Math.PI*2, rr=Math.random()*(R-30);
    const it=ITEMS[(Math.random()*ITEMS.length)|0];
    items.push({x:CX+Math.cos(a)*rr, y:CY+Math.sin(a)*rr, r:8, ...it, t:0});
  }

  // ---------- 更新 ----------
  function update(dt){
    time+=dt;
    level = 1 + Math.floor(time/25);
    stamina = Math.min(100, stamina + 16*dt);
    if(player.invuln>0) player.invuln-=dt;
    if(buffs.slow>0) buffs.slow-=dt;
    if(buffs.shield>0) buffs.shield-=dt;

    // 玩家移动：触屏=左区摇杆（速度积分），桌面=跟随鼠标；均限制在圈内
    if(touchDevice && joyActive){
      const vx=joyCur.x-joyOrigin.x, vy=joyCur.y-joyOrigin.y;
      const m=Math.hypot(vx,vy);
      if(m>3){
        const cm=Math.min(m, JOY_MAX);
        const sp=(cm/JOY_MAX)*MOVE_SPEED;
        player.x += (vx/m)*sp*dt;
        player.y += (vy/m)*sp*dt;
      }
    } else if(!touchDevice){
      player.x=mouse.x; player.y=mouse.y;
    }
    const dx=player.x-CX, dy=player.y-CY, d=Math.hypot(dx,dy);
    if(d > R-player.r){ player.x=CX+dx/d*(R-player.r); player.y=CY+dy/d*(R-player.r); }

    // 触屏右区按住：自动连续回击（受体力限制，每次 0.12s 一次）
    if(touchDevice && rightHeld){
      swingCd-=dt;
      if(swingCd<=0){ hitBall(); swingCd=0.12; }
    }

    // 护盾激活：自动反击进入攻击圈的所有来袭弹（不耗体力，整圈变青提示）
    if(buffs.shield>0){
      const srole=ROLES[selectedRole];
      for(const b of bullets){
        if(b.friendly) continue;
        if(Math.hypot(b.x-player.x, b.y-player.y) <= player.hitR + b.r){
          const locked=reflectBullet(b, srole, 7.5);
          spawnParticles(b.x,b.y,'#66ffcc',6,3);
          SFX.reflect(); if(locked) SFX.lock();
        }
      }
    }

    // 敌人 orbit + 开火
    for(const e of enemies){
      if(!e.alive) continue;
      e.ang += e.angSpeed*dt;
      e.fireTimer-=dt;
      if(e.fireTimer<=0){ fireEnemy(e); e.fireTimer = Math.max(0.9, 2.8 - level*0.07); }
    }

    // 生成敌人
    const maxE=Math.min(3+level, 12);
    spawnTimer-=dt;
    if(spawnTimer<=0 && enemies.length<maxE){
      spawnEnemy();
      spawnTimer = Math.max(0.7, 2.6 - level*0.09);
    }

    // 道具生成
    itemTimer-=dt;
    if(itemTimer<=0 && items.length<2){ spawnItem(); itemTimer=10; }

    // 子弹
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      let sp=1;
      if(!b.friendly && buffs.slow>0) sp=SLOW_FACTOR;
      b.x+=b.vx*sp; b.y+=b.vy*sp;

      // 追踪弹
      if(b.home && !b.friendly){
        const a=Math.atan2(player.y-b.y, player.x-b.x);
        b.vx += Math.cos(a)*0.06; b.vy += Math.sin(a)*0.06;
        const m=Math.hypot(b.vx,b.vy)||1; b.vx=b.vx/m*2.2; b.vy=b.vy/m*2.2;
      }

      // 锁敌反弹弹：在瞄准锥内命中后，持续微调方向追踪目标，确保对准后可靠击中
      if(b.friendly && b.lockTarget){
        const t=b.lockTarget;
        if(t && t.alive && enemies.includes(t)){
          const tp=enemyPos(t);
          const desired=Math.atan2(tp.y-b.y, tp.x-b.x);
          let cur=Math.atan2(b.vy,b.vx);
          let diff=desired-cur;
          while(diff>Math.PI) diff-=Math.PI*2;
          while(diff<-Math.PI) diff+=Math.PI*2;
          const turn=4.0*dt; // 转向速率（弧度/秒）
          if(Math.abs(diff)<=turn) cur=desired; else cur+=Math.sign(diff)*turn;
          const m=Math.hypot(b.vx,b.vy)||7.5;
          b.vx=Math.cos(cur)*m; b.vy=Math.sin(cur)*m;
        } else { b.lockTarget=null; b.locked=false; }
      }

      const distC2=Math.hypot(b.x-CX,b.y-CY);

      // 友好子弹：撞敌人
      if(b.friendly){
        let hit=false;
        for(const e of enemies){
          if(!e.alive) continue;
          const ep=enemyPos(e);
          if(Math.hypot(ep.x-b.x, ep.y-b.y) < 8+b.r){
            killEnemy(e);
            hit=true;
            if(b.explode){
              spawnParticles(b.x,b.y,'#ff8c42',14,3);
              for(const e2 of enemies){ if(e2.alive){ const ep2=enemyPos(e2); if(Math.hypot(ep2.x-b.x,ep2.y-b.y)<34) killEnemy(e2); } }
            }
            break;
          }
        }
        // 撞墙反弹（其他模式）
        if(!hit && distC2>R-b.r){
          if(b.bounceLeft>0){
            const nx=(b.x-CX)/(R), ny=(b.y-CY)/(R);
            const dot=b.vx*nx+b.vy*ny;
            b.vx-=2*dot*nx; b.vy-=2*dot*ny;
            b.bounceLeft--;
          } else { bullets.splice(i,1); continue; }
        }
        if(!hit && distC2>R+10){ bullets.splice(i,1); continue; }
      } else {
        // 敌方子弹：撞玩家
        if(Math.hypot(b.x-player.x,b.y-player.y) < player.r+b.r){
          if(player.invuln>0){ bullets.splice(i,1); continue; } // 受击无敌期间子弹穿过
          if(buffs.shield>0){ buffs.shield=0; spawnParticles(player.x,player.y,'#66ffcc',12,3); bullets.splice(i,1); continue; }
          lives--; player.invuln=1.2; spawnParticles(player.x,player.y,'#ff5d5d',14,3);
          SFX.hurt();
          bullets.splice(i,1);
          if(lives<=0){ gameOver(); }
          continue;
        }
        if(distC2>R+12){ bullets.splice(i,1); continue; }
      }
    }

    // 道具拾取
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      it.t+=dt;
      if(Math.hypot(it.x-player.x,it.y-player.y) < player.r+it.r){
        if(it.key==='shield') buffs.shield=8;
        else if(it.key==='slow') buffs.slow=6;
        else if(it.key==='energy') stamina=100;
        else if(it.key==='heal') lives=Math.min(5,lives+1);
        spawnParticles(it.x,it.y,it.color,12,3);
        SFX.pickup();
        items.splice(i, 1);
      }
    }

    enemies = enemies.filter(e=>e.alive);

    // 粒子
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.life-=dt*1.6;
      if(p.life<=0) particles.splice(i,1);
    }

    syncHud();
  }

  function killEnemy(e){
    e.alive=false;
    SFX.kill();
    score+=12; coins+=1; stamina=Math.min(100, stamina+8);
    runCoins++; runKills++;
    spawnParticles(enemyPos(e).x, enemyPos(e).y, '#ff5d5d', 12, 3);
  }

  function gameOver(){
    state='over';
    joyActive=false; rightHeld=false; joyOrigin=joyCur=null;
    SFX.over(); BGM.stop();
    const isNew = score>best;
    if(isNew){ best=score; save('pb_best',best); }
    coins+=0; save('pb_coins', coins);
    // 记录历史前三（按得分排序，保留前 3）
    top3.push({score, time:Math.floor(time), kills:runKills});
    top3.sort((a,b)=> b.score - a.score);
    top3 = top3.slice(0,3);
    save('pb_top3', top3);
    document.getElementById('finalScore').textContent=score;
    document.getElementById('finalCoins').textContent=getRunCoins();
    document.getElementById('overBest').textContent=best;
    document.getElementById('finalTime').textContent=fmtTime(Math.floor(time));
    document.getElementById('finalKills').textContent=runKills;
    document.getElementById('newBest').classList.toggle('hidden', !isNew);
    document.getElementById('over').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
  }
  let runCoins=0, runKills=0;
  function getRunCoins(){ return runCoins; }
  // 秒数格式化：mm:ss
  function fmtTime(t){ const m=Math.floor(t/60), s=t%60; return m+':'+(s<10?'0':'')+s; }

  // ---------- 渲染 ----------
  function render(){
    ctx.clearRect(0,0,W,H);
    // 背景网格
    ctx.fillStyle='#0b0e14'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#15202e'; ctx.lineWidth=1;
    for(let i=0;i<=W;i+=20){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
    for(let j=0;j<=H;j+=20){ ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(W,j); ctx.stroke(); }

    // 竞技场
    ctx.strokeStyle='#2b3344'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#0f1620';
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI* 2); ctx.fill();

    if(state==='play' || state==='over'){
      // 道具
      for(const it of items){
        ctx.fillStyle=it.color;
        ctx.fillRect(it.x-it.r, it.y-it.r, it.r*2, it.r*2);
        ctx.fillStyle='#0b0e14'; ctx.font='10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(it.label, it.x, it.y);
        // 拾取范围提示
        ctx.strokeStyle=it.color; ctx.globalAlpha=0.3;
        ctx.beginPath(); ctx.arc(it.x,it.y,it.r+4,0,Math.PI*2); ctx.stroke();
        ctx.globalAlpha=1;
      }
      // 子弹
      for(const b of bullets){
        ctx.fillStyle = b.friendly ? '#4dd2ff' : '#ff8c42';
        ctx.fillRect(b.x-b.r, b.y-b.r, b.r*2, b.r*2);
      }
      // 敌人
      for(const e of enemies){
        if(!e.alive) continue;
        const p=enemyPos(e);
        ctx.fillStyle = e.type==='spread' ? '#ff5d5d' : (e.type==='chaser' ? '#ff3da6' : '#ff7b7b');
        ctx.fillRect(p.x-8,p.y-8,16,16);
        ctx.fillStyle='#0b0e14';
        ctx.fillRect(p.x-4,p.y-2,3,3); ctx.fillRect(p.x+1,p.y-2,3, 3);
      }
      // 玩家击球范围（护盾激活时整圈变青色加粗；即将结束时闪烁提示）
      if(buffs.shield>0){
        const warn = buffs.shield < 1.5;                       // 最后 1.5 秒进入警示
        const blink = warn ? (Math.floor(time*12)%2===0) : true;
        ctx.strokeStyle = blink ? 'rgba(102,255,204,0.95)' : 'rgba(102,255,204,0.3)';
        ctx.lineWidth=2;
      } else {
        ctx.strokeStyle='rgba(255,209,102,0.5)'; ctx.lineWidth=1;
      }
      ctx.beginPath(); ctx.arc(player.x,player.y,player.hitR,0,Math.PI*2); ctx.stroke();
      // 玩家（小角色，受击无敌闪烁）
      if(!(player.invuln>0 && Math.floor(time*12)%2===0)){
        let bodyColor = '#ffd166';
        if(buffs.shield>0){
          const warn = buffs.shield < 1.5;
          bodyColor = (warn && Math.floor(time*12)%2===1) ? '#2f7d6b' : '#66ffcc';  // 警示帧变暗青，脉动闪烁
        }
        ctx.fillStyle = bodyColor;
        ctx.fillRect(player.x-4,player.y-4,9,9);
        ctx.fillStyle='#0b0e14';
        ctx.fillRect(player.x-2,player.y-2,2,2); ctx.fillRect(player.x+1,player.y-2,2,2);
      }
      // 触屏操控提示 + 左区摇杆
      if(touchDevice && state==='play'){
        ctx.save();
        ctx.globalAlpha=0.3; ctx.fillStyle='#9aa4b2'; ctx.font='11px monospace';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('◀ 移动', 34, CY);
        ctx.fillText('回击 ▶', W-34, CY);
        ctx.restore();
        if(joyActive && joyOrigin && joyCur){
          const jx=joyOrigin.x, jy=joyOrigin.y;
          if(jx>=0 && jx<=W && jy>=0 && jy<=H){
            ctx.strokeStyle='rgba(77,210,255,0.45)'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(jx,jy,JOY_MAX,0,Math.PI*2); ctx.stroke();
            const vx=joyCur.x-jx, vy=joyCur.y-jy, m=Math.hypot(vx,vy), cm=Math.min(m,JOY_MAX);
            const ux=m>0?vx/m:0, uy=m>0?vy/m:0;
            ctx.fillStyle='rgba(77,210,255,0.85)';
            ctx.beginPath(); ctx.arc(jx+ux*cm, jy+uy*cm, 7, 0, Math.PI*2); ctx.fill();
          }
        }
      }
      // 粒子
      for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life);
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x-1,p.y-1,3,3);
      }
      ctx.globalAlpha=1;
    } else {
      // 菜单时画一圈缓慢旋转的点
      const t=performance.now()/1000;
      for(let k=0;k<12;k++){
        const a=t*0.4 + k/12*Math.PI*2;
        const x=CX+Math.cos(a)*R, y=CY+Math.sin(a)*R;
        ctx.fillStyle=`hsl(${(k*30+t*40)%360},80%,60%)`;
        ctx.fillRect(x-5,y-5,10,10);
      }
    }
  }

  // ---------- HUD ----------
  const elScore=document.getElementById('score'), elCoin=document.getElementById('coin'),
        elHearts=document.getElementById('hearts'), elStam=document.getElementById('stamina'),
        elLvl=document.getElementById('lvlTxt');
  function syncHud(){
    elScore.textContent=score;
    elCoin.textContent=coins;
    elHearts.textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,5-lives));
    elStam.style.width=stamina+'%';
    elLvl.textContent='第 '+level+' 波';
  }

  // ---------- 菜单 ----------
  function renderRoles(){
    const box=document.getElementById('roles');
    box.innerHTML='';
    for(const k of ROLE_KEYS){
      const r=ROLES[k];
      const underDev = UNDER_DEV.has(k);
      const isUnlocked = unlocked.includes(k) && !underDev;
      const div=document.createElement('div');
      div.className='role'+(k===selectedRole&&!underDev?' sel':'')+(isUnlocked?'':' locked');
      div.innerHTML=`<div class="rn">${r.name}</div><div class="rd">${r.desc}</div>`+
        (underDev?`<div class="rc" style="color:#ff8c42">【未开发】</div>`
                 : isUnlocked?`<div class="rc" style="color:#6bff8c">已解锁</div>`
                             :`<div class="rc cost">💰 ${r.cost}</div>`);
      if(underDev){
        div.onclick=()=>{ alert('「'+r.name+'」尚未开发，敬请期待'); };
      }else if(isUnlocked){
        div.onclick=()=>{ selectedRole=k; renderRoles(); };
      }else{
        div.onclick=()=>{
          if(coins>=r.cost){ coins-=r.cost; unlocked.push(k); save('pb_coins',coins); save('pb_roles',unlocked); refreshMenu(); renderRoles(); }
          else { alert('金币不足，还差 '+(r.cost-coins)+' 枚'); }
        };
      }
      box.appendChild(div);
    }
  }
  function refreshMenu(){
    joyActive=false; rightHeld=false; joyOrigin=joyCur=null;
    document.getElementById('best').textContent=best;
    document.getElementById('coins').textContent=coins;
    renderTop3();
    document.getElementById('menu').classList.remove('hidden');
    document.getElementById('over').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    renderRoles();
  }
  // 首页历史前三（按得分，显示 得分 / 时间 / 杀敌数；金币为累计不列入）
  function renderTop3(){
    const box=document.getElementById('top3');
    if(!top3.length){ box.innerHTML='<div class="lbTitle">🏆 历史前三</div><div class="lbEmpty">暂无记录，快来挑战！</div>'; return; }
    let html='<div class="lbTitle">🏆 历史前三</div>';
    const ranks=['①','②','③'];
    top3.forEach((r,i)=>{
      html+='<div class="lbRow"><span class="lbRank">'+ranks[i]+'</span>'+
            '<span>分 <b>'+r.score+'</b></span>'+
            '<span>时 <b>'+fmtTime(r.time)+'</b></span>'+
            '<span>杀 <b>'+r.kills+'</b></span></div>';
    });
    box.innerHTML=html;
  }

  document.getElementById('startBtn').onclick=()=>{
    audioInit(); SFX.start(); BGM.start();
    newGame(); runCoins=0; state='play';
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    syncHud();
  };
  document.getElementById('retryBtn').onclick=()=>{
    audioInit(); SFX.start(); BGM.start();
    newGame(); runCoins=0; state='play';
    document.getElementById('over').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    syncHud();
  };
  document.getElementById('menuBtn').onclick=()=>{ state='menu'; BGM.stop(); refreshMenu(); };

  // 静音开关（置于开始页，便于进游戏前设置）
  const menuMute=document.getElementById('menuMute');
  function syncMute(){ menuMute.textContent = SoundOn ? '🔊' : '🔇'; }
  syncMute();
  menuMute.onclick=()=>{
    SoundOn=!SoundOn; save('pb_sound',SoundOn); syncMute();
    audioInit();
    if(SoundOn){ if(state==='play') BGM.start(); SFX.pickup(); }
    else { BGM.stop(); }
  };

  // 游戏中返回菜单（手动退出）
  document.getElementById('backBtn').onclick=()=>{
    state='menu'; BGM.stop(); refreshMenu();
  };
  // 首次用户交互解锁 AudioContext（浏览器自动播放策略）
  ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, audioInit, {once:true}));

  // 击杀金币已在 killEnemy 内累计

  refreshMenu();

  // ---------- 主循环 ----------
  let lastT=0;
  function loop(t){
    const dt=Math.min(0.05,(t-lastT)/1000||0); lastT=t;
    if(state==='play') update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
